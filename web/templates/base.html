<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Falcon Stocks{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Falcon Stocks dashboard">
      <span class="brand-mark">F</span>
      <span><strong>Falcon Stocks</strong><small>Positional Trading Research Dashboard</small></span>
    </a>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
