services:
  falcon-stocks:
    build:
      context: .
    image: falcon-stocks:local
    init: true
    ipc: host
    environment:
      FALCON_BROWSER_HEADLESS: "true"
      FALCON_STOCK_READER: /app/cpp/build/stock_reader
    volumes:
      - ./auth:/app/auth
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
